services:
  vaultwarden:
    image: vaultwarden/server:latest
    restart: unless-stopped
    volumes:
     - data:/data:rw
    environment:
     - ADMIN_TOKEN=${ADMIN_TOKEN}
     - WEBSOCKET_ENABLED=true
     - SIGNUPS_ALLOWED=false
     - DOMAIN=${DOMAIN}
     - EXPERIMENTAL_CLIENT_FEATURE_FLAGS=ssh-key-vault-item,ssh-agent
    networks:
      - default
      - netstackbridge

  backup:
    image: ttionya/vaultwarden-backup:latest
    restart: unless-stopped
    environment:
      RCLONE_REMOTE_NAME: 'RcloneBackup'
      RCLONE_REMOTE_DIR: ${RCLONE_REMOTE_DIR}
      CRON: '0 5 * * WED'
      #CRON: '* * * * *'
      ZIP_ENABLE: 'TRUE'
      ZIP_PASSWORD: ${RCLONE_BACKUP_ENCRYPTION_PASSWORD}
      ZIP_TYPE: '7z'
      BACKUP_FILE_SUFFIX: '%Y-%m-%d_%H-%M-%S'
      BACKUP_KEEP_DAYS: 30
      TIMEZONE: 'Europe/Vienna'
      MAIL_SMTP_ENABLE: 'TRUE'
      MAIL_SMTP_VARIABLES: >-
        -S 'v15-compat'
        -S 'mta=smtp://${SMTP_SERVER}'
        -S 'smtp-use-starttls'
        -S 'smtp-auth=login'
        -S 'user=${SMTP_SENDER_EMAIL}'
        -S 'password=${SMTP_SENDER_PASSWORD}'
        -S 'from=Vaultwarden Backup <$SMTP_SENDER_EMAIL>'
      MAIL_TO: ${SMTP_RECEIVER_EMAIL}
    volumes:
      - ~/.config/rclone:/config/rclone
      - data:/bitwarden/data:r

networks:
  default:
  netstackbridge:
    external: true
    name: netstack_bridge

volumes:
  data:
